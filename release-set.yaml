# Upstream medik8s builds of the six components WAO installs.
#
# tag: the selected image tag. Exactly latest stays floating; every other tag is
#   resolved to a digest. commit: the git commit embedded in the published image,
#   read by hack/image-commit.sh. config/operands/<k>/vendored is copied from this
#   commit. For latest this is a manifest snapshot; future pulls can run newer code.
# images: tagged is the matching reference in embedded runtime manifests; pullRef
#   is the deployed reference (repository:latest or repository@sha256:...). The WAO
#   Deployment carries pullRef as RELATED_IMAGE_* and the renderer substitutes it.
# overlay: the kustomize directory in the vendored config/ tree that WAO renders.
# kustomizeName: the image name that directory leaves for the runtime overlay to retag.
#
# make update-release-set defaults to OPERAND_TAG=latest. Use OPERAND_TAG=release
# for GitHub release tags, an explicit version, or per-component NHC_TAG=... etc.
# OPERAND_TAG=pinned keeps the recorded tags and refreshes pull references and commits;
# it does not freeze latest. The standalone script defaults to release.
