apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: controller-manager
    node-maintenance-operator: ""
    workloadavailability.medik8s.io/component: nodeMaintenance
  name: node-maintenance-operator-controller-manager-metrics-service
  namespace: __WAO_NAMESPACE__
spec:
  ports:
    - name: https
      port: 8443
      targetPort: https
  selector:
    control-plane: controller-manager
    node-maintenance-operator: ""
    workloadavailability.medik8s.io/component: nodeMaintenance
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: node-maintenance-operator-webhook-server-cert
  labels:
    node-maintenance-operator: ""
    workloadavailability.medik8s.io/component: nodeMaintenance
  name: node-maintenance-operator-webhook-service
  namespace: __WAO_NAMESPACE__
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: controller-manager
    node-maintenance-operator: ""
    workloadavailability.medik8s.io/component: nodeMaintenance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    control-plane: controller-manager
    node-maintenance-operator: ""
    workloadavailability.medik8s.io/component: nodeMaintenance
  name: node-maintenance-operator-controller-manager
  namespace: __WAO_NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      node-maintenance-operator: ""
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        node-maintenance-operator: ""
        workloadavailability.medik8s.io/component: nodeMaintenance
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/infra
                    operator: Exists
              weight: 3
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: Exists
              weight: 1
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
              weight: 1
      containers:
        - args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --leader-elect
            - --enable-http2=false
          command:
            - /manager
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: quay.io/medik8s/node-maintenance-operator:wao
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
            - containerPort: 8443
              name: https
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 100Mi
            requests:
              cpu: 100m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
      serviceAccountName: node-maintenance-operator-controller-manager
      terminationGracePeriodSeconds: 10
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Exists
        - effect: NoExecute
          key: node-role.kubernetes.io/infra
          operator: Exists
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: node-maintenance-operator-webhook-server-cert
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    node-maintenance-operator: ""
    workloadavailability.medik8s.io/component: nodeMaintenance
  name: node-maintenance-operator-validating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: node-maintenance-operator-webhook-service
        namespace: __WAO_NAMESPACE__
        path: /validate-nodemaintenance-medik8s-io-v1beta1-nodemaintenance
    failurePolicy: Fail
    name: vnodemaintenance.kb.io
    rules:
      - apiGroups:
          - nodemaintenance.medik8s.io
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - nodemaintenances
    sideEffects: None
    timeoutSeconds: 15
