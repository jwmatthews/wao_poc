apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: controller-manager
    app.kubernetes.io/name: node-healthcheck-operator
    workloadavailability.medik8s.io/component: nodeHealthCheck
  name: node-healthcheck-controller-manager
  namespace: __WAO_NAMESPACE__
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: controller-manager
      app.kubernetes.io/name: node-healthcheck-operator
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/component: controller-manager
        app.kubernetes.io/name: node-healthcheck-operator
        workloadavailability.medik8s.io/component: nodeHealthCheck
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/infra
                    operator: Exists
              weight: 3
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: Exists
              weight: 1
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
              weight: 1
      containers:
        - args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0.0.0.0:8443
            - --leader-elect
            - --enable-http2=false
          command:
            - /manager
          env:
            - name: DEPLOYMENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          image: quay.io/medik8s/node-healthcheck-operator:latest
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/true
            preStop:
              exec:
                command:
                  - sleep
                  - "5"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 20
          name: manager
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 20Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 12
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 5
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: webhook-server-cert
              readOnly: true
            - mountPath: /etc/tls/private
              name: tls-config
              readOnly: true
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: node-healthcheck-controller-manager
      terminationGracePeriodSeconds: 15
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Exists
        - effect: NoExecute
          key: node-role.kubernetes.io/infra
          operator: Exists
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: controller-manager
              app.kubernetes.io/name: node-healthcheck-operator
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      volumes:
        - name: webhook-server-cert
          secret:
            defaultMode: 420
            secretName: node-healthcheck-webhook-server-cert
        - name: tls-config
          secret:
            secretName: node-healthcheck-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: node-remediation-console-plugin
    app.kubernetes.io/name: node-healthcheck-operator
    workloadavailability.medik8s.io/component: nodeHealthCheck
  name: node-healthcheck-node-remediation-console-plugin
  namespace: __WAO_NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: node-remediation-console-plugin
      app.kubernetes.io/name: node-healthcheck-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/component: node-remediation-console-plugin
        app.kubernetes.io/name: node-healthcheck-operator
        workloadavailability.medik8s.io/component: nodeHealthCheck
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/infra
                    operator: Exists
              weight: 3
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: Exists
              weight: 1
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
              weight: 1
      containers:
        - image: quay.io/medik8s/node-remediation-console:latest
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/true
            preStop:
              exec:
                command:
                  - sleep
                  - "5"
          livenessProbe:
            periodSeconds: 10
            tcpSocket:
              port: 9443
            timeoutSeconds: 3
          name: node-remediation-console-plugin
          ports:
            - containerPort: 9443
              name: nrc-server
              protocol: TCP
          readinessProbe:
            periodSeconds: 5
            tcpSocket:
              port: 9443
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 12
            periodSeconds: 5
            tcpSocket:
              port: 9443
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - mountPath: /var/serving-cert
              name: nrc-plugin-cert
              readOnly: true
            - mountPath: /opt/app-root/etc/passwd
              name: nrc-nss-passwd
              subPath: passwd
            - mountPath: /var/log/nginx
              name: nrc-nginx-log
            - mountPath: /var/lib/nginx/tmp
              name: nrc-nginx-tmp
            - mountPath: /run
              name: nrc-nginx-run
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: node-healthcheck-console-plugin
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Exists
        - effect: NoExecute
          key: node-role.kubernetes.io/infra
          operator: Exists
      volumes:
        - name: nrc-plugin-cert
          secret:
            defaultMode: 420
            secretName: nrc-plugin-cert
        - emptyDir: {}
          name: nrc-nss-passwd
        - emptyDir: {}
          name: nrc-nginx-log
        - emptyDir: {}
          name: nrc-nginx-tmp
        - emptyDir: {}
          name: nrc-nginx-run
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    app.kubernetes.io/name: node-healthcheck-operator
    workloadavailability.medik8s.io/component: nodeHealthCheck
  name: node-healthcheck-validating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: node-healthcheck-webhook-service
        namespace: __WAO_NAMESPACE__
        path: /validate-remediation-medik8s-io-v1alpha1-nodehealthcheck
    failurePolicy: Fail
    name: vnodehealthcheck.kb.io
    rules:
      - apiGroups:
          - remediation.medik8s.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - nodehealthchecks
    sideEffects: None
