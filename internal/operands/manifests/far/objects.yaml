apiVersion: v1
data:
  controller_manager_config.yaml: |
    apiVersion: controller-runtime.sigs.k8s.io/v1alpha1
    kind: ControllerManagerConfig
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: 127.0.0.1:8080
    webhook:
      port: 9443
    leaderElection:
      leaderElect: true
      resourceName: cb305759.medik8s.io
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: fence-agents-remediation-operator
    workloadavailability.medik8s.io/component: fenceAgentsRemediation
  name: fence-agents-remediation-manager-config
  namespace: __WAO_NAMESPACE__
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: fence-agents-remediation-operator
    control-plane: controller-manager
    workloadavailability.medik8s.io/component: fenceAgentsRemediation
  name: fence-agents-remediation-controller-manager-metrics-service
  namespace: __WAO_NAMESPACE__
spec:
  ports:
    - name: https
      port: 8443
      targetPort: https
  selector:
    app.kubernetes.io/name: fence-agents-remediation-operator
    control-plane: controller-manager
    workloadavailability.medik8s.io/component: fenceAgentsRemediation
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: fence-agents-remediation-webhook-server-cert
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/created-by: fence-agents-remediation
    app.kubernetes.io/instance: webhook-service
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: fence-agents-remediation-operator
    app.kubernetes.io/part-of: fence-agents-remediation
    workloadavailability.medik8s.io/component: fenceAgentsRemediation
  name: fence-agents-remediation-webhook-service
  namespace: __WAO_NAMESPACE__
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    app.kubernetes.io/name: fence-agents-remediation-operator
    control-plane: controller-manager
    workloadavailability.medik8s.io/component: fenceAgentsRemediation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: fence-agents-remediation-operator
    control-plane: controller-manager
    workloadavailability.medik8s.io/component: fenceAgentsRemediation
  name: fence-agents-remediation-controller-manager
  namespace: __WAO_NAMESPACE__
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fence-agents-remediation-operator
      control-plane: controller-manager
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: fence-agents-remediation-operator
        control-plane: controller-manager
        workloadavailability.medik8s.io/component: fenceAgentsRemediation
    spec:
      containers:
        - args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --leader-elect
            - --enable-http2=false
          command:
            - /manager
          env:
            - name: DEPLOYMENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: quay.io/medik8s/fence-agents-remediation-operator:latest
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/true
            preStop:
              exec:
                command:
                  - sleep
                  - "5"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 20
          name: manager
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 12
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 5
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: webhook-server-cert
              readOnly: true
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: fence-agents-remediation-controller-manager
      terminationGracePeriodSeconds: 15
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: fence-agents-remediation-operator
              control-plane: controller-manager
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      volumes:
        - name: webhook-server-cert
          secret:
            defaultMode: 420
            secretName: fence-agents-remediation-webhook-server-cert
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    app.kubernetes.io/name: fence-agents-remediation-operator
    workloadavailability.medik8s.io/component: fenceAgentsRemediation
  name: fence-agents-remediation-mutating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: fence-agents-remediation-webhook-service
        namespace: __WAO_NAMESPACE__
        path: /mutate-fence-agents-remediation-medik8s-io-v1alpha1-fenceagentsremediation
    failurePolicy: Fail
    name: mfenceagentsremediation.kb.io
    rules:
      - apiGroups:
          - fence-agents-remediation.medik8s.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - fenceagentsremediations
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: fence-agents-remediation-webhook-service
        namespace: __WAO_NAMESPACE__
        path: /mutate-fence-agents-remediation-medik8s-io-v1alpha1-fenceagentsremediationtemplate
    failurePolicy: Fail
    name: mfenceagentsremediationtemplate.kb.io
    rules:
      - apiGroups:
          - fence-agents-remediation.medik8s.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - fenceagentsremediationtemplates
    sideEffects: None
