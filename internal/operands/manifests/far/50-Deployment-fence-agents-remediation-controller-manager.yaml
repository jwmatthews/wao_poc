apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: fence-agents-remediation-operator
    control-plane: controller-manager
  name: fence-agents-remediation-controller-manager
  namespace: __WAO_NAMESPACE__
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fence-agents-remediation-operator
      control-plane: controller-manager
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: fence-agents-remediation-operator
        control-plane: controller-manager
        workloadavailability.medik8s.io/component: fenceAgentsRemediation
    spec:
      containers:
      - args:
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8443
        - --leader-elect
        - --enable-http2=false
        command:
        - /manager
        env:
        - name: DEPLOYMENT_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: quay.io/medik8s/fence-agents-remediation-operator:latest
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/true
          preStop:
            exec:
              command:
              - sleep
              - '5'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 12
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 5
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-server-cert
          readOnly: true
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: fence-agents-remediation-controller-manager
      terminationGracePeriodSeconds: 15
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: fence-agents-remediation-operator
            control-plane: controller-manager
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      volumes:
      - name: webhook-server-cert
        secret:
          defaultMode: 420
          secretName: fence-agents-remediation-webhook-server-cert
