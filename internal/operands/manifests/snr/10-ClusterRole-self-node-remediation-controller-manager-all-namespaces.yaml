apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: self-node-remediation-controller-manager-all-namespaces
rules:
- apiGroups:
  - ''
  - coordination.k8s.io
  resources:
  - configmaps
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - patch
