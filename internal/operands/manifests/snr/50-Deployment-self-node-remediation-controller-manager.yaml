apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    control-plane: controller-manager
    self-node-remediation-operator: ''
  name: self-node-remediation-controller-manager
  namespace: __WAO_NAMESPACE__
spec:
  replicas: 2
  selector:
    matchLabels:
      control-plane: controller-manager
      self-node-remediation-operator: ''
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        control-plane: controller-manager
        self-node-remediation-operator: ''
        workloadavailability.medik8s.io/component: selfNodeRemediation
    spec:
      containers:
      - args:
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8443
        - --leader-elect
        - --is-manager
        - --enable-http2=false
        command:
        - /manager
        env:
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: SELF_NODE_REMEDIATION_IMAGE
          value: quay.io/medik8s/self-node-remediation-operator:v0.13.0
        - name: DEPLOYMENT_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: quay.io/medik8s/self-node-remediation-operator:v0.13.0
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/true
          preStop:
            exec:
              command:
              - sleep
              - '5'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        - containerPort: 8443
          name: https
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 20m
            memory: 110Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 12
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 5
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-server-cert
          readOnly: true
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: self-node-remediation-controller-manager
      terminationGracePeriodSeconds: 15
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            control-plane: controller-manager
            self-node-remediation-operator: ''
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      volumes:
      - name: webhook-server-cert
        secret:
          defaultMode: 420
          secretName: self-node-remediation-webhook-server-cert
