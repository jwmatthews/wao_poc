apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    service.beta.openshift.io/inject-cabundle: 'true'
  name: self-node-remediation-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: self-node-remediation-webhook-service
      namespace: __WAO_NAMESPACE__
      path: /validate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediation
      port: 443
  failurePolicy: Ignore
  name: vselfnoderemediation.kb.io
  rules:
  - apiGroups:
    - self-node-remediation.medik8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - selfnoderemediations
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: self-node-remediation-webhook-service
      namespace: __WAO_NAMESPACE__
      path: /validate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediationconfig
      port: 443
  failurePolicy: Fail
  name: vselfnoderemediationconfig.kb.io
  rules:
  - apiGroups:
    - self-node-remediation.medik8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - selfnoderemediationconfigs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: self-node-remediation-webhook-service
      namespace: __WAO_NAMESPACE__
      path: /validate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediationtemplate
      port: 443
  failurePolicy: Fail
  name: vselfnoderemediationtemplate.kb.io
  rules:
  - apiGroups:
    - self-node-remediation.medik8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - selfnoderemediationtemplates
  sideEffects: None
