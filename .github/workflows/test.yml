name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r hack/requirements.txt

      - name: Check pinned manifests and run offline tests
        run: make bundles operand-manifests-check test-offline PYTHON=python

      - name: Running Tests
        run: |
          go mod tidy
          make test
