#     UNSCOPED: no ConfigMap in the bundle; kept unscoped so the preflight check (Technology Preview) cannot fail on a downstream-only object
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - create
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - update
  - patch
  - delete
# --- Secrets (experiment-only breadth)
#     source: task requirement; no bundle ships a Secret; serving-cert Secrets are created by service-ca, not by the installer
#     UNSCOPED: no Secret is rendered by OLM v1 for these bundles; granted cluster-wide only so the experiment never stalls on a Secret the downstream bundle might add
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# --- Roles and RoleBindings (only rendered when the extension is installed with a watchNamespace; in AllNamespaces mode permissions are promoted to ClusterRoles)
#     source: docs: olmv1-required-rbac...adoc 'Roles and role bindings'; CSV install.spec.permissions
#     UNSCOPED: generated names <csv>-<sa>-<hash> unknown before install
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - create
  - list
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - get
  - update
  - patch
  - delete
