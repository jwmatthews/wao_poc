# exp0001: NodeHealthCheck that passes vnodehealthcheck.kb.io.
# The selector matches no node (label key exp0001.example.com/never-matches is never set), so
# even a real create is inert: NHC observes zero nodes and never creates a remediation CR.
# Webhook checks (node-healthcheck-operator/internal/webhook/v1alpha1/nodehealthcheck_webhook.go:100-107):
#   exactly one of minHealthy/maxUnhealthy, non-empty selector, remediationTemplate xor
#   escalatingRemediations, supported control-plane topology.
apiVersion: remediation.medik8s.io/v1alpha1
kind: NodeHealthCheck
metadata:
  name: exp0001-nhc
spec:
  minHealthy: "51%"
  selector:
    matchLabels:
      exp0001.example.com/never-matches: "true"
  unhealthyConditions:
  - type: Ready
    status: "False"
    duration: 300s
  - type: Ready
    status: Unknown
    duration: 300s
  remediationTemplate:
    apiVersion: self-node-remediation.medik8s.io/v1alpha1
    kind: SelfNodeRemediationTemplate
    name: self-node-remediation-automatic-strategy-template
    namespace: openshift-workload-availability
