# exp0001: SelfNodeRemediation for a node that does not exist. DRY-RUN ONLY (--dry-run=server).
# SNR derives the node from metadata.name; exp0001-no-such-node cannot be acted on.
# Webhook vselfnoderemediation.kb.io (failurePolicy Ignore) only runs validateStrategy
# (self-node-remediation/internal/webhook/v1alpha1/selfnoderemediation_webhook.go:46-55).
apiVersion: self-node-remediation.medik8s.io/v1alpha1
kind: SelfNodeRemediation
metadata:
  name: exp0001-no-such-node
  namespace: openshift-workload-availability
spec:
  remediationStrategy: Automatic
