# exp0001: same object as nhc-valid.yaml plus maxUnhealthy. Both minHealthy and maxUnhealthy set is
# NOT a CRD/CEL rule; only the webhook rejects it:
#   node-healthcheck-operator/api/v1alpha1/validation.go:33-35
#   "minHealthy and maxUnhealthy cannot be specified at the same time"
# called from internal/webhook/v1alpha1/nodehealthcheck_webhook.go:102 (create and update).
# Same metadata.name as nhc-valid.yaml so `oc apply --dry-run=server` exercises UPDATE on the valid object.
apiVersion: remediation.medik8s.io/v1alpha1
kind: NodeHealthCheck
metadata:
  name: exp0001-nhc
spec:
  minHealthy: "51%"
  maxUnhealthy: 1
  selector:
    matchLabels:
      exp0001.example.com/never-matches: "true"
  unhealthyConditions:
  - type: Ready
    status: "False"
    duration: 300s
  - type: Ready
    status: Unknown
    duration: 300s
  remediationTemplate:
    apiVersion: self-node-remediation.medik8s.io/v1alpha1
    kind: SelfNodeRemediationTemplate
    name: self-node-remediation-automatic-strategy-template
    namespace: openshift-workload-availability
