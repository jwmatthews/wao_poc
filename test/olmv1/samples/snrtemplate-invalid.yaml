# exp0001: the ONLY check vselfnoderemediationtemplate.kb.io performs is
#   selfnoderemediationtemplate_webhook.go:88-93 validateStrategy:
#   OutOfServiceTaint && !utils.IsOutOfServiceTaintSupported  (k8s < 1.26 only)
#   => "OutOfServiceTaint remediation strategy is not supported at kubernetes version lower than 1.26,
#       please use a different remediation strategy"
# Any other strategy value is a CRD enum (schema) error. On OpenShift 4.14+ (k8s >= 1.27) this sample
# is ADMITTED; there is no constructible webhook-level rejection for this CRD on the target cluster.
apiVersion: self-node-remediation.medik8s.io/v1alpha1
kind: SelfNodeRemediationTemplate
metadata:
  name: exp0001-snr-template
  namespace: openshift-workload-availability
spec:
  template:
    spec:
      remediationStrategy: OutOfServiceTaint
