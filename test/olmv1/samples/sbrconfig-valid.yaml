# exp0001 CONTROL: StorageBasedRemediationConfig. DRY-RUN ONLY -- NEVER create for real (it would
# render a DaemonSet/PVC). Belt and braces: detectOnlyMode Enabled and a nodeSelector that matches no
# node (both fields exist in the shipped v0.3.0 CRD). The validating webhook
# vstoragebasedremediationconfig.kb.io exists in source (storage-based-remediation/api/v1alpha1/
# storagebasedremediationconfig_webhook.go:31) but the bundle passes --enable-webhooks=false
# (CSV line 330) and config/default/kustomization.yaml keeps ../webhook commented out, so NO webhook
# is registered on the cluster.
apiVersion: storage-based-remediation.medik8s.io/v1alpha1
kind: StorageBasedRemediationConfig
metadata:
  name: exp0001-sbr-config
  namespace: openshift-workload-availability
spec:
  detectOnlyMode: Enabled
  nodeSelector:
    exp0001.example.com/never-matches: "true"
  watchdogPath: /dev/watchdog
