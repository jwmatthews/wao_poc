  precondition: FAR manager running and able to GET Secrets in the namespace (mutating webhook looks up fence-agents-credentials-shared, fenceagentsremediationtemplate_webhook.go:99-126)
  notes: Run with `-o yaml` and check the annotation (wao_poc 08-enable-far.sh:49-50). If a Secret named fence-agents-credentials-shared exists, spec.template.spec.sharedSecretName is also defaulted to it.
