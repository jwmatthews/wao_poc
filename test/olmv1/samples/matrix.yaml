  sample: mdr-valid.yaml
  expected: skip
  expected_substring: ""
  webhook: none
  failure_policy: n/a
  precondition: UNMET -- dry-run only by policy (a real MDR CR would be reconciled)
  notes: CONTROL.
- operator: mdr
