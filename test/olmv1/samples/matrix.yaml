  precondition: exp0001-far-template exists (create for real; templates are inert)
  notes: ValidateUpdate = validateSpec + shared-secret-default-name check (params.go:108-115); the latter is a no-op because the old object has no sharedSecretName.
- operator: far
  crd: fenceagentsremediationtemplates.fence-agents-remediation.medik8s.io
  verb: update
  sample: fartemplate-invalid.yaml
  expected: reject
  expected_substring: "unsupported fence agent: fence_exp0001_does_not_exist"
