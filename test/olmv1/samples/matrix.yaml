  expected: reject
  expected_substring: "unsupported fence agent: fence_exp0001_does_not_exist"
  webhook: vfenceagentsremediationtemplate.kb.io
  failure_policy: Fail
  precondition: FAR manager running
  notes: fenceagentsremediation_params.go:163 (os.Stat of the agent binary in the manager image). Proven shape in wao_poc 08-enable-far.sh:47-48.
- operator: far
  crd: fenceagentsremediationtemplates.fence-agents-remediation.medik8s.io
  verb: update
  sample: fartemplate-valid.yaml
