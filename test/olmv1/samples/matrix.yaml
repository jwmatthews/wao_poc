# ---------------------------------------------------------------- NMO
- operator: nmo
  crd: nodemaintenances.nodemaintenance.medik8s.io
  verb: create
  sample: nm-valid.yaml
  expected: reject
  expected_substring: "invalid nodeName, no node with name exp0001-no-such-node found"
  webhook: vnodemaintenance.kb.io
  failure_policy: Fail
  precondition: NMO manager running
  notes: >-
    By design the "valid" sample is REJECTED: the webhook's first check is node existence
    (nodemaintenance_webhook.go:78-83,116-123, const :38). A real node name is forbidden, so this
    rejection string is the proof the webhook answered (same probe as wao_poc 10-enable-nmo.sh:20-30).
    A true admit for NMO is not constructible without naming a real node.
- operator: nmo
  crd: nodemaintenances.nodemaintenance.medik8s.io
  verb: create
  sample: nm-invalid.yaml
  expected: reject
  expected_substring: "invalid nodeName, no node with name exp0001-no-such-node-invalid found"
  webhook: vnodemaintenance.kb.io
  failure_policy: Fail
  precondition: NMO manager running
  notes: Same check as nm-valid; the duplicate-NM (:125-138) and etcd-quorum (:140-167) checks need a real node.
- operator: nmo
  crd: nodemaintenances.nodemaintenance.medik8s.io
  verb: update
  sample: nm-valid.yaml
  expected: skip
  expected_substring: ""
  webhook: vnodemaintenance.kb.io
  failure_policy: Fail
  precondition: UNMET -- a NodeMaintenance can only exist for a real node (the webhook blocks fake ones); forbidden
  notes: ValidateUpdate only rejects nodeName changes ("updating spec.NodeName isn't allowed", :41,:103-106).
- operator: nmo
  crd: nodemaintenances.nodemaintenance.medik8s.io
  verb: update
  sample: nm-invalid.yaml
  expected: skip
  expected_substring: "updating spec.NodeName isn't allowed"
  webhook: vnodemaintenance.kb.io
  failure_policy: Fail
  precondition: UNMET -- see above
  notes: Would be reject (nodeName differs from nm-valid) if an exp0001-nm object could exist.

