# exp0001 admission-webhook expectation matrix.
# One row per (operator, crd, verb, sample). All commands are run with --dry-run=server and never
# persist anything. See README.md for derivation and caveats.
#
# Fields
#   expected            admit | reject | skip  (skip = precondition cannot be met under the experiment's
#                       no-real-object policy; row kept for completeness)
#   expected_substring  must appear in stderr when expected=reject; for admit rows an optional signal
#   webhook             webhook that handles the request (name from the CSV webhookdefinitions);
#                       "none" = no webhook registered for this resource/verb on the target cluster
#   failure_policy      the webhook's failurePolicy (what happens if the webhook server is unreachable)
#   precondition        what must be true before the command is meaningful
#
# Verb commands (NS=openshift-workload-availability; cluster-scoped kinds ignore -n):
#   create: oc create --dry-run=server -f <sample>
#   update: oc apply  --dry-run=server -f <sample>     # object MUST already exist; apply on a missing
#                                                      # object becomes CREATE. Do not use `oc replace`
#                                                      # for CRs without resourceVersion (storage rejects
#                                                      # before admission: "must be specified for an update").
#   delete: oc delete --dry-run=server -f <sample>     # object MUST already exist
# A webhook rejection is always of the form:
#   admission webhook "<webhook>" denied the request: <expected_substring>

namespace: openshift-workload-availability
rows:

# ---------------------------------------------------------------- NHC
- operator: nhc
  crd: nodehealthchecks.remediation.medik8s.io
  verb: create
  sample: nhc-valid.yaml
  expected: admit
  expected_substring: ""
  webhook: vnodehealthcheck.kb.io
  failure_policy: Fail
  precondition: NHC manager running; cluster topology is HA/SNO/Arbiter/External (nodehealthcheck_webhook.go:115-120)
  notes: selector matches no node so the object is inert even if created for real.
- operator: nhc
  crd: nodehealthchecks.remediation.medik8s.io
  verb: create
  sample: nhc-invalid.yaml
  expected: reject
  expected_substring: "minHealthy and maxUnhealthy cannot be specified at the same time"
  webhook: vnodehealthcheck.kb.io
  failure_policy: Fail
  precondition: NHC manager running
  notes: api/v1alpha1/validation.go:34; no CRD/CEL rule covers this (proven in wao_poc 05-enable-nhc.sh).
- operator: nhc
  crd: nodehealthchecks.remediation.medik8s.io
  verb: update
  sample: nhc-valid.yaml
  expected: admit
  expected_substring: ""
  webhook: vnodehealthcheck.kb.io
  failure_policy: Fail
  precondition: exp0001-nhc exists (create nhc-valid.yaml for real; inert)
  notes: ValidateUpdate re-runs validate() (nodehealthcheck_webhook.go:74-89); not remediating so no restricted-field check.
- operator: nhc
  crd: nodehealthchecks.remediation.medik8s.io
  verb: update
  sample: nhc-invalid.yaml
  expected: reject
  expected_substring: "minHealthy and maxUnhealthy cannot be specified at the same time"
  webhook: vnodehealthcheck.kb.io
  failure_policy: Fail
  precondition: exp0001-nhc exists
  notes: apply merges maxUnhealthy onto the existing minHealthy -> both set -> validation.go:34.
- operator: nhc
  crd: nodehealthchecks.remediation.medik8s.io
  verb: delete
  sample: nhc-valid.yaml
  expected: admit
  expected_substring: ""
  webhook: vnodehealthcheck.kb.io
  failure_policy: Fail
  precondition: exp0001-nhc exists
  notes: ValidateDelete only rejects while remediating (nodehealthcheck_webhook.go:92-98, "deletion prohibited due to running remediation"); exp0001-nhc never remediates.

# ---------------------------------------------------------------- SNR config
- operator: snr
  crd: selfnoderemediationconfigs.self-node-remediation.medik8s.io
  verb: create
  sample: snrconfig-valid.yaml
  expected: admit
  expected_substring: ""
  webhook: vselfnoderemediationconfig.kb.io
  failure_policy: Fail
  precondition: SNR manager running with DEPLOYMENT_NAMESPACE=openshift-workload-availability (CSV env fieldRef)
  notes: >-
    SNR auto-creates self-node-remediation-config, so after the webhook ADMITS, storage returns
    `AlreadyExists` (409). Treat `selfnoderemediationconfigs.self-node-remediation.medik8s.io
    "self-node-remediation-config" already exists` as admit-by-webhook; a webhook denial would instead
    read `admission webhook "vselfnoderemediationconfig.kb.io" denied the request`. If the default config
    is absent (manager never ran), the dry-run create succeeds outright.
- operator: snr
  crd: selfnoderemediationconfigs.self-node-remediation.medik8s.io
  verb: create
  sample: snrconfig-invalid.yaml
  expected: reject
  expected_substring: "ApiServerTimeout cannot be less than 10ms"
  webhook: vselfnoderemediationconfig.kb.io
  failure_policy: Fail
  precondition: SNR manager running
  notes: selfnoderemediationconfig_webhook.go:48,152. Admission runs before the storage AlreadyExists check, so the webhook denial is what you see.
- operator: snr
  crd: selfnoderemediationconfigs.self-node-remediation.medik8s.io
  verb: create
  sample: snrconfig-invalid-name.yaml
  expected: reject
  expected_substring: "a name other than self-node-remediation-config is not allowed"
  webhook: vselfnoderemediationconfig.kb.io
  failure_policy: Fail
  precondition: SNR manager running
  notes: selfnoderemediationconfig_webhook.go:295-296 validateSingleton (create only). Shape of wao_poc 06-enable-snr.sh:35-44.
- operator: snr
  crd: selfnoderemediationconfigs.self-node-remediation.medik8s.io
  verb: update
  sample: snrconfig-valid.yaml
  expected: admit
  expected_substring: ""
  webhook: vselfnoderemediationconfig.kb.io
  failure_policy: Fail
  precondition: default config self-node-remediation-config exists in the namespace (created by SNR)
  notes: Values equal CRD defaults; a dry-run apply changes nothing. May warn "PeerRequestTimeout ..." only if values violate the 2s buffer (they do not; 7s >= 5s+2s).
- operator: snr
  crd: selfnoderemediationconfigs.self-node-remediation.medik8s.io
  verb: update
  sample: snrconfig-invalid.yaml
  expected: reject
  expected_substring: "ApiServerTimeout cannot be less than 10ms"
  webhook: vselfnoderemediationconfig.kb.io
  failure_policy: Fail
  precondition: default config exists
  notes: ValidateUpdate runs validateTimes (selfnoderemediationconfig_webhook.go:96-106). No PeerRequestTimeout warning is expected (the merged peerRequestTimeout 7s >= 1ms + 2s buffer).
- operator: snr
  crd: selfnoderemediationconfigs.self-node-remediation.medik8s.io
  verb: delete
  sample: snrconfig-valid.yaml
  expected: admit
  expected_substring: "The default configuration is deleted, Self Node Remediation is now disabled"
  webhook: vselfnoderemediationconfig.kb.io
  failure_policy: Fail
  precondition: default config exists
  notes: >-
    Admitted WITH an admission warning (selfnoderemediationconfig_webhook.go:109-120); oc prints it as
    `Warning: The default configuration is deleted, ...`. The warning is the positive proof the DELETE
    webhook answered. Dry-run, nothing is deleted. The only operator registering DELETE besides NHC.

# ---------------------------------------------------------------- SNR template
- operator: snr
  crd: selfnoderemediationtemplates.self-node-remediation.medik8s.io
  verb: create
  sample: snrtemplate-valid.yaml
  expected: admit
  expected_substring: "remediation.medik8s.io/multiple-templates-support: \"true\""
  webhook: mselfnoderemediationtemplate.kb.io, vselfnoderemediationtemplate.kb.io
  failure_policy: Fail
  precondition: SNR manager running
  notes: >-
    Run with `-o yaml`; the annotation added by the mutating webhook
    (selfnoderemediationtemplate_webhook.go:52-60) is the proof both webhooks answered (wao_poc
    06-enable-snr.sh:58-59 uses the same signal).
- operator: snr
  crd: selfnoderemediationtemplates.self-node-remediation.medik8s.io
  verb: create
  sample: snrtemplate-invalid.yaml
  expected: admit
  expected_substring: ""
  webhook: mselfnoderemediationtemplate.kb.io, vselfnoderemediationtemplate.kb.io
  failure_policy: Fail
  precondition: SNR manager running; k8s >= 1.26 (any supported OCP)
  notes: >-
    NO constructible webhook-level rejection: validateStrategy (selfnoderemediationtemplate_webhook.go:88-93)
    only rejects OutOfServiceTaint on k8s < 1.26 ("OutOfServiceTaint remediation strategy is not supported
    at kubernetes version lower than 1.26, please use a different remediation strategy"); any other
    strategy string is a CRD enum error. Use the mutating annotation as the signal instead.
- operator: snr
  crd: selfnoderemediationtemplates.self-node-remediation.medik8s.io
  verb: update
  sample: snrtemplate-valid.yaml
  expected: admit
  expected_substring: "remediation.medik8s.io/multiple-templates-support: \"true\""
  webhook: mselfnoderemediationtemplate.kb.io, vselfnoderemediationtemplate.kb.io
  failure_policy: Fail
  precondition: exp0001-snr-template exists (create for real; templates are inert)
  notes: Mutating webhook also runs on UPDATE (CSV rules CREATE/UPDATE).
- operator: snr
  crd: selfnoderemediationtemplates.self-node-remediation.medik8s.io
  verb: update
  sample: snrtemplate-invalid.yaml
  expected: admit
  expected_substring: ""
  webhook: mselfnoderemediationtemplate.kb.io, vselfnoderemediationtemplate.kb.io
  failure_policy: Fail
  precondition: exp0001-snr-template exists
  notes: Same version gate as the create row; admitted on the target cluster.

# ---------------------------------------------------------------- SNR CR
- operator: snr
  crd: selfnoderemediations.self-node-remediation.medik8s.io
  verb: create
  sample: snr-valid.yaml
  expected: admit
  expected_substring: ""
  webhook: vselfnoderemediation.kb.io
  failure_policy: Ignore
  precondition: SNR manager running
  notes: >-
    failurePolicy Ignore: an unreachable webhook ALSO admits, so admission alone proves nothing. Evidence
    the webhook answered is the manager log: logger "selfnoderemediation-resource" msg "validate create"
    name "exp0001-no-such-node" (selfnoderemediation_webhook.go:30,47). DRY-RUN ONLY.
- operator: snr
  crd: selfnoderemediations.self-node-remediation.medik8s.io
  verb: create
  sample: snr-invalid.yaml
  expected: admit
  expected_substring: ""
  webhook: vselfnoderemediation.kb.io
  failure_policy: Ignore
  precondition: SNR manager running; k8s >= 1.26
  notes: NO constructible rejection (same version-gated validateStrategy). Check the manager log line as above.
- operator: snr
  crd: selfnoderemediations.self-node-remediation.medik8s.io
  verb: update
  sample: snr-valid.yaml
  expected: skip
  expected_substring: ""
  webhook: vselfnoderemediation.kb.io
  failure_policy: Ignore
  precondition: UNMET -- a SelfNodeRemediation must exist for an UPDATE, and these are dry-run only by policy
  notes: Would be admit; no rejection path exists anyway.
- operator: snr
  crd: selfnoderemediations.self-node-remediation.medik8s.io
  verb: update
  sample: snr-invalid.yaml
  expected: skip
  expected_substring: ""
  webhook: vselfnoderemediation.kb.io
  failure_policy: Ignore
  precondition: UNMET -- dry-run only by policy
  notes: Would be admit (version gate).

