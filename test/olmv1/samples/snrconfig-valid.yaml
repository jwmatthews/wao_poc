# exp0001: SelfNodeRemediationConfig that passes vselfnoderemediationconfig.kb.io.
# The webhook enforces a singleton: name MUST be self-node-remediation-config and the namespace MUST
# equal the manager's DEPLOYMENT_NAMESPACE (self-node-remediation/internal/webhook/v1alpha1/
# selfnoderemediationconfig_webhook.go:294-304). SNR creates this object itself at startup
# (api/v1alpha1/selfnoderemediationconfig_types.go:189-192), so a dry-run CREATE is admitted by the
# webhook and then fails in storage with AlreadyExists; UPDATE/DELETE dry-runs target the real default.
# Values below are the CRD defaults (selfnoderemediationconfig_types.go:56-97), all >= the webhook
# minimums (selfnoderemediationconfig_webhook.go:47-52).
apiVersion: self-node-remediation.medik8s.io/v1alpha1
kind: SelfNodeRemediationConfig
metadata:
  name: self-node-remediation-config
  namespace: openshift-workload-availability
spec:
  watchdogFilePath: /dev/watchdog
  apiServerTimeout: 5s
  peerApiServerTimeout: 5s
  peerDialTimeout: 5s
  peerRequestTimeout: 7s
  apiCheckInterval: 15s
  peerUpdateInterval: 15m
