# exp0001: DRY-RUN ONLY. The other webhook checks (duplicate NodeMaintenance :125-138, etcd quorum
# :140-167) require a REAL node name, which is forbidden for this experiment, so the "invalid" sample
# trips the same node-existence check with a distinct node name:
#   nodemaintenance_webhook.go:38,120
#   => "invalid nodeName, no node with name exp0001-no-such-node-invalid found"
apiVersion: nodemaintenance.medik8s.io/v1beta1
kind: NodeMaintenance
metadata:
  name: exp0001-nm
spec:
  nodeName: exp0001-no-such-node-invalid
  reason: exp0001 admission probe (dry-run only)
