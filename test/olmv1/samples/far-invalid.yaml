# exp0001: DRY-RUN ONLY. --action other than reboot/off is a pure webhook check:
#   fence-agents-remediation/api/v1alpha1/fenceagentsremediation_params.go:48
#     ErrorUnsupportedAction = "FAR doesn't support any other action than `reboot` or `off`"
#   raised at :319-328 validateFenceAction, called from validateFenceAgentParams :257, reached through
#   validateSpec :149 -> validateFenceAgentForNodes :225 -> BuildFenceAgentParams :343.
# Why not the suggested triggers: a missing `agent` is a CRD `required` (schema) error, and a node-name
# mismatch is not validated (node names come from the spec, not metadata.name, params.go:234-246).
apiVersion: fence-agents-remediation.medik8s.io/v1alpha1
kind: FenceAgentsRemediation
metadata:
  name: exp0001-no-such-node
  namespace: openshift-workload-availability
spec:
  agent: fence_ipmilan
  remediationStrategy: ResourceDeletion
  sharedparameters:
    --ip: "192.0.2.1"
    --lanplus: ""
    --action: status
  nodeparameters:
    --ipport:
      exp0001-no-such-node: "6230"
