# exp0001: SelfNodeRemediationTemplate. Templates never act on nodes, so a real create is inert.
# Mutating webhook mselfnoderemediationtemplate.kb.io adds the annotation
#   remediation.medik8s.io/multiple-templates-support: "true"
# (self-node-remediation/internal/webhook/v1alpha1/selfnoderemediationtemplate_webhook.go:52-60) --
# its presence in `--dry-run=server -o yaml` output proves the mutating webhook answered.
# Validating webhook vselfnoderemediationtemplate.kb.io only checks the strategy (:88-93).
apiVersion: self-node-remediation.medik8s.io/v1alpha1
kind: SelfNodeRemediationTemplate
metadata:
  name: exp0001-snr-template
  namespace: openshift-workload-availability
spec:
  template:
    spec:
      remediationStrategy: Automatic
