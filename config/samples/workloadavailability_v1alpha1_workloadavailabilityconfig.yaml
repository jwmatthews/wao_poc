apiVersion: workloadavailability.medik8s.io/v1alpha1
kind: WorkloadAvailabilityConfig
metadata:
  name: cluster
spec:
  components:
    nodeHealthCheck:
      enabled: false
    selfNodeRemediation:
      enabled: false
    storageBasedRemediation:
      enabled: false
    nodeMaintenance:
      enabled: false
    fenceAgentsRemediation:
      enabled: false
    machineDeletionRemediation:
      enabled: false
