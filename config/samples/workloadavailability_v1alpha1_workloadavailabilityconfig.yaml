apiVersion: workloadavailability.medik8s.io/v1alpha1
kind: WorkloadAvailabilityConfig
metadata:
  name: cluster
spec:
  components:
    nodeHealthCheck:
      state: Disabled
    selfNodeRemediation:
      state: Disabled
    storageBasedRemediation:
      state: Disabled
    nodeMaintenance:
      state: Disabled
    fenceAgentsRemediation:
      state: Disabled
    machineDeletionRemediation:
      state: Disabled
