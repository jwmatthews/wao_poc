# The operand leaves an envsubst placeholder here; WAO sets a static token that the renderer
# replaces with the RELATED_IMAGE_SNR_MANAGER runtime value.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-node-remediation-controller-manager
spec:
  template:
    spec:
      containers:
        - name: manager
          env:
            - name: SELF_NODE_REMEDIATION_IMAGE
              value: __WAO_RELATED_IMAGE_SNR_MANAGER__:placeholder
