# Operand RBAC for the WAO CSV. operator-sdk folds every Role and ClusterRole bound to a
# ServiceAccount named in --extra-service-accounts (Makefile OPERAND_SERVICE_ACCOUNTS) into the
# CSV; unbound ClusterRoles become standalone bundle objects. OLM creates all of it at install.
#
# Built from the same vendored OpenShift overlay as ../runtime so the two stay one packaging
# (release-set.yaml overlay). Names are already prefixed by the overlay. Everything that is not
# RBAC is deleted here: the runtime kinds are rendered by WAO, the CRDs come from
# config/operands/crd, and the operand's CSV, Namespace, sample CR and scorecard config are not
# WAO's to ship.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../vendored/config/manifests/ocp
patches:
# The overlay's kube-system Role lets the manager read the client CA in
# kube-system/extension-apiserver-authentication, which it needs to enable metrics mTLS. Its
# RoleBinding names the unprefixed ServiceAccount (the overlay keeps that directory outside the
# name-prefix component, see the vendored kustomization), so operator-sdk would not fold it and
# would ship it as a standalone namespaced object OLM cannot create in kube-system. Rebinding it
# to the operand's ServiceAccount folds the rule into the CSV, where OLM's AllNamespaces install
# promotes it to a ClusterRole, which is what NHC's own `make bundle-ocp` relies on.
- target:
    kind: RoleBinding
    name: manager-rolebinding
  patch: |
    - op: replace
      path: /subjects/0/name
      value: node-healthcheck-controller-manager
- target: {kind: ClusterServiceVersion}
  patch: |
    $patch: delete
    apiVersion: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    metadata:
      name: any
- target: {kind: CustomResourceDefinition}
  patch: |
    $patch: delete
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: any
- target: {kind: Namespace}
  patch: |
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: any
- target: {kind: NodeHealthCheck}
  patch: |
    $patch: delete
    apiVersion: remediation.medik8s.io/v1alpha1
    kind: NodeHealthCheck
    metadata:
      name: any
- target: {kind: Configuration}
  patch: |
    $patch: delete
    apiVersion: scorecard.operatorframework.io/v1alpha3
    kind: Configuration
    metadata:
      name: any
- target: {kind: Deployment}
  patch: |
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: any
- target: {kind: Service}
  patch: |
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: any
- target: {kind: ConfigMap}
  patch: |
    $patch: delete
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: any
- target: {kind: ValidatingWebhookConfiguration}
  patch: |
    $patch: delete
    apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    metadata:
      name: any
