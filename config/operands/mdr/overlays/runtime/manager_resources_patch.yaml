# WAO memory defaults for MDR startup. See https://github.com/jwmatthews/wao_poc/issues/40.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: machine-deletion-remediation-controller-manager
spec:
  template:
    spec:
      containers:
        - name: manager
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
