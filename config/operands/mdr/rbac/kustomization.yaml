# Operand RBAC for the WAO CSV. operator-sdk folds every Role and ClusterRole bound to a
# ServiceAccount named in --extra-service-accounts (Makefile OPERAND_SERVICE_ACCOUNTS) into the
# CSV; unbound ClusterRoles become standalone bundle objects. OLM creates all of it at install.
# The metrics Service also lives in the vendored config/rbac; the runtime overlay renders it instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: machine-deletion-remediation-
resources:
- ../vendored/config/rbac
patches:
- target:
    kind: Service
  patch: |
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: any
