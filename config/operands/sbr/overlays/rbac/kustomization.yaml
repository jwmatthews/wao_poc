# Operand RBAC for the WAO CSV. operator-sdk folds every Role and ClusterRole bound to a
# ServiceAccount named in --extra-service-accounts (Makefile OPERAND_SERVICE_ACCOUNTS) into the
# CSV; unbound ClusterRoles become standalone bundle objects. OLM creates all of it at install.
# The SBR agent ServiceAccount is listed in OPERAND_STANDALONE_SERVICE_ACCOUNTS instead, so its
# ClusterRole keeps the name sbr-operator-sbr-agent-role that the SBR manager binds at runtime.
# Unlike the other operands, SBR's metrics Service lives in the copied config/default, not
# config/rbac, so this wrapper needs no $patch: delete block for it.
# sbr_agent_privileged_scc_role.yaml is added explicitly because the copied config/rbac
# kustomization omits it although the controller binds sbr-operator-sbr-agent-privileged-scc by
# name (internal/controller/storagebasedremediationconfig_controller.go). It is outside this
# kustomization's root, so builds of it need --load-restrictor LoadRestrictionsNone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: sbr-operator-
resources:
- ../../config/rbac
- ../../config/rbac/sbr_agent_privileged_scc_role.yaml
