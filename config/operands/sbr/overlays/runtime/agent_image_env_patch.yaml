# The operand leaves an envsubst placeholder here; WAO sets a static token that the renderer
# replaces with the RELATED_IMAGE_SBR_AGENT runtime value.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbr-operator-controller-manager
spec:
  template:
    spec:
      containers:
        - name: manager
          env:
            - name: RELATED_IMAGE_AGENT
              value: __WAO_RELATED_IMAGE_SBR_AGENT__:placeholder
