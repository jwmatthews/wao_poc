# Upstream leaves ${AGENT_IMG} for envsubst; WAO sets the upstream agent reference, which the
# renderer replaces with the pinned agent image. `make operand-manifests` keeps the value current.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbr-operator-controller-manager
spec:
  template:
    spec:
      containers:
        - name: manager
          env:
            - name: RELATED_IMAGE_AGENT
              value: quay.io/medik8s/storage-based-remediation-agent:latest
