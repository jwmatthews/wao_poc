---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - workloadavailability.medik8s.io
  resources:
  - workloadavailabilityconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workloadavailability.medik8s.io
  resources:
  - workloadavailabilityconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - workloadavailability.medik8s.io
  resources:
  - workloadavailabilityconfigs/status
  verbs:
  - get
  - patch
  - update
