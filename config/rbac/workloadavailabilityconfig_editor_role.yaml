# This rule is not used by the project workload-availability-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the workloadavailability.medik8s.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: workload-availability-operator
    app.kubernetes.io/managed-by: kustomize
  name: workloadavailabilityconfig-editor-role
rules:
- apiGroups:
  - workloadavailability.medik8s.io
  resources:
  - workloadavailabilityconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workloadavailability.medik8s.io
  resources:
  - workloadavailabilityconfigs/status
  verbs:
  - get
