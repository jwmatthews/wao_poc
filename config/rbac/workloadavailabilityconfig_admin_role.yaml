# This rule is not used by the project workload-availability-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over workloadavailability.medik8s.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: workload-availability-operator
    app.kubernetes.io/managed-by: kustomize
  name: workloadavailabilityconfig-admin-role
rules:
- apiGroups:
  - workloadavailability.medik8s.io
  resources:
  - workloadavailabilityconfigs
  verbs:
  - '*'
- apiGroups:
  - workloadavailability.medik8s.io
  resources:
  - workloadavailabilityconfigs/status
  verbs:
  - get
