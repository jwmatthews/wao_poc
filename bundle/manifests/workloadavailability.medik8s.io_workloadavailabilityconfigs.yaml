apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  creationTimestamp: null
  name: workloadavailabilityconfigs.workloadavailability.medik8s.io
spec:
  group: workloadavailability.medik8s.io
  names:
    kind: WorkloadAvailabilityConfig
    listKind: WorkloadAvailabilityConfigList
    plural: workloadavailabilityconfigs
    shortNames:
    - wac
    singular: workloadavailabilityconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Available")].status
      name: Available
      type: string
    - jsonPath: .status.conditions[?(@.type=="Progressing")].status
