      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WorkloadAvailabilityConfig provides cluster-wide configuration for the six
          medik8s component operators. WAO automatically creates this cluster-scoped
          singleton with the name cluster and all components Disabled. Edit the existing
          cluster resource to configure components. When creating it manually, use the
          name cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkloadAvailabilityConfigSpec defines the desired state
              of the installation.
            properties:
              components:
                description: |-
                  Choose which component operators WAO runs. All components default to
                  Disabled. Disabling removes the component manager and its managed
                  installation resources; resources created by that component can remain.
                  Disable a component only when it has no active work.
                properties:
                  fenceAgentsRemediation:
                    description: |-
                      Runs the Fence Agents Remediation operator. Fencing requires separately
                      configured remediation resources and fence-agent credentials.
                    properties:
                      state:
                        default: Disabled
                        description: |-
                          Enabled runs the operator. Disabled removes its manager and managed
                          installation resources; existing agents, configuration, and native resources
                          can remain. Complete active maintenance or remediation before disabling.
                          Default: Disabled.
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                    type: object
                  machineDeletionRemediation:
                    description: |-
                      Runs the Machine Deletion Remediation operator. Machine deletion requires
                      a separate remediation request.
                    properties:
                      state:
                        default: Disabled
                        description: |-
                          Enabled runs the operator. Disabled removes its manager and managed
                          installation resources; existing agents, configuration, and native resources
                          can remain. Complete active maintenance or remediation before disabling.
                          Default: Disabled.
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                    type: object
                  nodeHealthCheck:
                    description: |-
                      Runs the Node Health Check operator. Configure a NodeHealthCheck policy
                      separately to enable automated health monitoring and remediation.
                    properties:
                      state:
                        default: Disabled
                        description: |-
                          Enabled runs the operator. Disabled removes its manager and managed
                          installation resources; existing agents, configuration, and native resources
                          can remain. Complete active maintenance or remediation before disabling.
                          Default: Disabled.
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                    type: object
                  nodeMaintenance:
                    description: |-
                      Runs the Node Maintenance operator. Creating a NodeMaintenance resource
                      separately requests node cordoning and draining. Complete active maintenance
                      before disabling; stopping the manager does not uncordon a node.
                    properties:
                      state:
                        default: Disabled
                        description: |-
                          Enabled runs the operator. Disabled removes its manager and managed
                          installation resources; existing agents, configuration, and native resources
                          can remain. Complete active maintenance or remediation before disabling.
                          Default: Disabled.
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                    type: object
                  selfNodeRemediation:
                    description: |-
                      Runs the Self Node Remediation operator. Enabling this component creates
                      its default configuration and starts privileged node agents on eligible
                      nodes. Disabling does not remove existing node agents or their configuration.
                    properties:
                      state:
                        default: Disabled
                        description: |-
                          Enabled runs the operator. Disabled removes its manager and managed
                          installation resources; existing agents, configuration, and native resources
                          can remain. Complete active maintenance or remediation before disabling.
                          Default: Disabled.
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                    type: object
                  storageBasedRemediation:
                    description: |-
                      Runs the Storage Based Remediation operator. Configure a
                      StorageBasedRemediationConfig separately to deploy its agents and configure
                      storage-based fencing. Existing agents and storage configuration can remain
                      after disabling.
                    properties:
                      state:
                        default: Disabled
                        description: |-
                          Enabled runs the operator. Disabled removes its manager and managed
                          installation resources; existing agents, configuration, and native resources
                          can remain. Complete active maintenance or remediation before disabling.
                          Default: Disabled.
                        enum:
                        - Enabled
                        - Disabled
                        type: string
                    type: object
                type: object
            type: object
          status:
            description: WorkloadAvailabilityConfigStatus defines the observed state.
            properties:
              components:
                items:
                  description: ComponentStatus reports one component.
                  properties:
                    admissionReady:
                      description: admissionReady is nil for components without webhooks.
                      type: boolean
                    deployments:
                      items:
                        description: DeploymentStatus reports one operand Deployment.
                        properties:
                          desiredReplicas:
                            format: int32
                            type: integer
                          name:
                            type: string
                          ready:
                            type: boolean
                          readyReplicas:
                            format: int32
                            type: integer
                        required:
                        - desiredReplicas
                        - name
                        - ready
                        - readyReplicas
                        type: object
                      type: array
                    desiredState:
                      description: ComponentState is the administrator's intent for
                        one component.
                      enum:
                      - Enabled
                      - Disabled
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    phase:
                      description: ComponentPhase summarizes one component's observed
                        lifecycle state.
                      type: string
                    retainedResources:
                      description: |-
                        retainedResources lists objects that outlive a manager-level disable: agent DaemonSets and
                        their native configs, and native objects the stopped manager would have reconciled (for
                        example an active NodeMaintenance). Non-empty means DisableIncomplete.
                      items:
                        type: string
                      type: array
                  required:
                  - desiredState
                  - name
                  - phase
                  type: object
                type: array
              conditions:
                description: |-
                  Available, Progressing, and Degraded describe WAO reconciliation.
                  Available means reconciliation succeeded, including when all components
                  are Disabled; it does not mean workloads are protected. Check component
                  status for retained resources after disabling.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              installNamespace:
                description: Namespace where WAO installs component operators.
                type: string
              observedGeneration:
                description: Configuration generation last processed by WAO.
                format: int64
                type: integer
              releaseSet:
                items:
                  description: ImageReference is one pinned image in the release set.
                  properties:
                    image:
                      type: string
                    name:
                      type: string
                  required:
                  - image
                  - name
                  type: object
                type: array
            type: object
        type: object
        x-kubernetes-validations:
        - message: WorkloadAvailabilityConfig is a singleton and must be named 'cluster'
          rule: self.metadata.name == 'cluster'
    served: true
    storage: true
    subresources:
      status: {}
